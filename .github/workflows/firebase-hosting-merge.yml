# Deploy to Firebase Hosting on merge to main branch
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DANANG_HUB_APP }}
          channelId: live
          projectId: danang-hub-app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DANANG_HUB_APP }}

      # Firestore rules only. The CI service account (roles/firebase.sdkAdminServiceAgent)
      # can publish rulesets, but it has no datastore.indexes.* permission and no
      # firebasestorage.* permission at all — so `--only firestore` (indexes) and
      # `--only storage` (resolves the default bucket first) both fail the job.
      # Indexes and Storage rules stay manual owner deploys; see docs/backlog.
      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project danang-hub-app --non-interactive

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project danang-hub-app --non-interactive

  # Tags the deployed commit v<package.json version> the first time that
  # version ships, so each release maps to a commit, and publishes a GitHub
  # release from that version's CHANGELOG.md section. Unbumped merges skip.
  tag_release:
    needs: build_and_deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already tagged; nothing to do."
            exit 0
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          echo "Tagged $GITHUB_SHA as $VERSION."
          # Notes: the "## $VERSION" section of CHANGELOG.md, up to the next
          # version heading; GitHub's generated notes when there is none.
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} /^## v/ {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
